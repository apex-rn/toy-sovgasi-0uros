<style>
  :root{
    --green:#3dff7a; --green2:#22c55e; --gdim:#3f7a52; --gold:#e3c27a; --text:#f0f3f6; --grey:#7d8590;
    --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
    --arabic:"Amiri","Traditional Arabic",serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#000;color:var(--text);overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
  body{font-family:var(--mono);-webkit-font-smoothing:antialiased;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  #stage{position:fixed;left:0;top:0;width:100%;height:100%;overflow:hidden}
  canvas.layer{position:absolute;left:0;top:0;pointer-events:none}
  #photo{position:absolute;opacity:0;pointer-events:none;-webkit-user-drag:none}
  #scan{position:absolute;left:0;top:0;height:1px;background:#bfffd3;box-shadow:0 0 14px 2px rgba(61,255,122,.55);opacity:0;pointer-events:none;will-change:transform}
  .cur::after{content:"█";animation:blink 1s steps(1) infinite;margin-left:1px;color:var(--green)}
  @keyframes blink{50%{opacity:0}}
  @keyframes fadeIn{to{opacity:1}}

  /* start */
  #start{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 22px;gap:30px;color:var(--green);z-index:20;transition:opacity .6s}
  #start .lines{font-size:16px;line-height:1.9;max-width:560px;margin:0 auto;width:100%}
  #start .lines div{opacity:0;animation:fadeIn .25s forwards}
  #start .muted{color:var(--gdim)}
  .btns{display:flex;flex-direction:column;gap:12px;max-width:560px;margin:0 auto;width:100%;opacity:0;animation:fadeIn .5s 1.6s forwards}
  .btn{font-family:var(--mono);font-size:16px;min-height:52px;padding:14px 16px;border-radius:6px;border:1px solid var(--green2);background:transparent;color:var(--green);cursor:pointer;text-align:left}
  .btn .d{color:var(--gdim)}

  /* terminal */
  #term{position:absolute;inset:0;padding:calc(24px + env(safe-area-inset-top)) 18px 30px;display:flex;flex-direction:column;justify-content:flex-end;
        color:#c9d1d9;font-size:clamp(13px,4.1vw,17px);line-height:1.7;z-index:12;opacity:0;transition:opacity .7s;pointer-events:none;overflow:hidden}
  #term .inner{max-width:640px;margin:0 auto;width:100%}
  #term .p{color:var(--green)} #term .h{color:#e3b341} #term .t{color:var(--grey)} #term .w{color:#fff;font-weight:700;white-space:nowrap}
  #term .big{font-size:clamp(20px,5.8vw,26px);color:#fff;margin-top:8px;line-height:1.45}
  #term .row{white-space:pre-wrap;word-break:break-word}

  /* verse */
  #verse{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
         padding:0 20px;z-index:13;opacity:0;transition:opacity 1.4s;pointer-events:none;background:rgba(0,0,0,.8)}
  #verse .ar{font-family:var(--arabic);font-size:clamp(40px,11vw,72px);color:var(--gold);direction:rtl;line-height:1.7}
  #verse .tr{font-size:clamp(18px,5vw,24px);color:#fff;margin-top:16px;line-height:1.5}
  #verse .ref{font-size:13px;color:var(--grey);margin-top:10px}

  /* slides */
  #slides{position:absolute;inset:0;z-index:14;background:#000;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity 1s}
  #slides.show{opacity:1;pointer-events:auto}
  #sTop{display:flex;justify-content:space-between;align-items:center;padding:calc(16px + env(safe-area-inset-top)) 20px 0;font-size:13px;color:var(--grey);min-height:48px}
  #sHead{color:var(--green2)}
  #sBody{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 24px;max-width:640px;width:100%;margin:0 auto}
  #sText{font-size:clamp(21px,5.9vw,28px);line-height:1.6;color:var(--text);white-space:pre-wrap;word-break:break-word;text-wrap:pretty;transition:opacity .15s}
  #sText.big{font-size:clamp(28px,8.4vw,44px);font-weight:700;line-height:1.35;color:#fff}
  #sText.big.gold{color:var(--gold)}
  #sText .ghost{color:transparent}
  .caret{display:inline-block;width:0;position:relative}
  .caret::after{content:"";position:absolute;left:2px;top:-.92em;width:.5em;height:1.05em;background:var(--green);animation:blink 1s steps(1) infinite}
  #sBar{height:2px;background:#161b22;margin:0 20px 14px}
  #sBar i{display:block;height:100%;width:0;background:var(--green2);transition:width .5s}
  #sBot{display:flex;justify-content:space-between;align-items:center;padding:0 20px calc(22px + env(safe-area-inset-bottom));gap:12px}
  #sNum{font-size:13px;color:var(--grey)}
  #sBack{font-family:var(--mono);font-size:14px;color:var(--grey);background:none;border:none;min-height:48px;padding:0 6px;cursor:pointer;visibility:hidden}
  #sNext{position:relative;overflow:hidden;font-family:var(--mono);font-size:16px;color:var(--green);background:transparent;border:1px solid var(--green2);border-radius:6px;
         min-height:50px;padding:0 18px;cursor:pointer;opacity:0;transition:opacity .3s;pointer-events:none;font-variant-numeric:tabular-nums}
  #sNext.on{opacity:1;pointer-events:auto}
  #sNext .fill{position:absolute;left:0;top:0;bottom:0;width:100%;background:rgba(61,255,122,.16);transform-origin:left;transform:scaleX(0)}
  #sNext .lbl{position:relative}
  #sNext .sec{color:var(--gdim);margin-left:8px}

  /* final */
  #final{position:absolute;inset:0;z-index:16;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
         padding:calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));opacity:0;pointer-events:none;transition:opacity 1.8s;background:#000}
  #final.show{opacity:1;pointer-events:auto}
  #bgRain{position:absolute;inset:0;width:100%;height:100%;z-index:0;opacity:.14;pointer-events:none;transition:opacity 2s}
  #fx{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
  #final > *:not(canvas){transition:opacity 1.8s ease}
  #final.pre > *:not(canvas){opacity:0}
  @media (max-height:600px){ #term{line-height:1.55} #term .big{font-size:19px} }
  #final > *:not(canvas){position:relative;z-index:2}
  #final .photo{border:1px solid #2b3a30;padding:5px;background:#050805}
  #final .photo img{display:block;height:min(52vh,560px);height:min(52dvh,560px);width:auto;max-width:86vw;object-fit:cover}
  #final .names{font-size:clamp(22px,6.6vw,34px);color:#fff;margin-top:18px;font-weight:700;white-space:nowrap}
  #final .names .amp{color:var(--green);font-weight:400;margin:0 .35em}
  #final .sub{font-size:clamp(18px,5.2vw,24px);color:var(--gold);margin-top:8px}
  #final .sign{margin-top:14px;font-size:13px;color:var(--grey)}
  #final .acts{display:flex;gap:10px;justify-content:center;margin-top:18px}
  #final button{font-family:var(--mono);font-size:14px;color:var(--green);background:transparent;border:1px solid #1d5e33;min-height:46px;padding:0 16px;border-radius:6px;cursor:pointer}
  @media (max-height:480px){ #final .sign{display:none} #final .photo img{height:min(46vh,46dvh)} }

</style>

  <div id="verse">

</div>

  <div style="position:fixed;inset:0;overflow:auto;background:#000;color:#eee;padding:20px;text-align:center;font-family:monospace">

<script>
/* ============ SOZLAMALAR ============ */
const CONFIG = { aka: "Muhammadrizo", kelin: "Rano", kelinMurojaat: "kennayam", sana: "08.11.2026" };

/* ============ XAT ============
   h: bo'lim,  big: katta,  gold: oltin,  slow: sekin,  quiet: musiqa jimiydi
   matn ichida [[p:ms]] — to'xtash */
// Akam qachon ochishiga qarab: to'y kuni — "bugun", ertasi — "kecha", keyinroq — kunsiz (Toshkent vaqti)
const TOY_KUNI = "2026-11-08";
const kunFarqi = Math.round((Date.parse(new Date(Date.now() + 5*3600e3).toISOString().slice(0,10)) - Date.parse(TOY_KUNI)) / 864e5);
const DAY = kunFarqi <= 0 ? "bugun" : kunFarqi === 1 ? "kecha" : "";
const SLIDES = [
  { h:"// 01 — " + (DAY || "to'ying"), t:"Assalomu alaykum, akam." },
  { t: DAY === "bugun" ? "Mana bugun eng uzoq kutilgan kuning —\nto'ying ekan."
     : DAY === "kecha" ? "Mana kecha eng uzoq kutilgan kuning —\nto'ying bo'ldi."
     :                   "Mana eng uzoq kutilgan kuning —\nto'ying ham bo'ldi." },
  { t:"Seni chin qalbimdan tabriklayman.\nChin yuragimdan baxt tilayman." },
  { t:(DAY ? DAY[0].toUpperCase() + DAY.slice(1) + " t" : "T") + "o'ying bo'layotganini,\nseni kuyov bola kiyimida ko'rib\njuda xursand bo'ldim.\nSenga juda yarasharkan." },
  { t:"To'yingda ukang bo'lib oldingda turishni,\nto'yingni o'z ko'zim bilan ko'rishni xohlagandim.[[p:1200]]\nLekin afsus, oldingda bo'la olmadim." },
  { t:"Lekin to'yingni telefonda bo'lsa ham ko'rganimdan xursandman.\nJuda zo'r o'tibdi — men kutganimdan ham yaxshi." },

  { h:"// 02 — sen haqingda", t:"Shu kungacha eng ko'p qiyinchiliklarni,\neng ko'p hayot sinovlarini sen ko'rding.\nLekin hech qachon taslim bo'lmading." },
  { t:"Biz uchun qo'lingdan kelganini qilding.\nMeni hamisha, har tomonlama qo'llab-quvvatlading.\nHozirgi kungacha ham." },
  { t:"Sendek akam borligidan faxrlanaman.\nKo'p hollarda menga o'rnak bo'lgansan." },
  { t:"Sen men uchun\ndunyodagi eng zo'r akasan.", big:true, quiet:true },
  { t:"Seni yaxshi ko'raman, akam.\nHammasi uchun rahmat.", big:true, gold:true, slow:true, quiet:true },
  { t:"Inshaalloh, hali rohatini ko'rasizlar.\nVa'da beraman.", slow:true },

  { h:"// 03 — ikkovingizga", t:`Akam, ${CONFIG.kelin} ${CONFIG.kelinMurojaat} —\nikkovingizni ham chin yurakdan tabriklayman.` },
  { t:"Baxtli bo'linglar, qo'sha qaringlar.\nUzoq umr ko'ringlar, sog'-salomat bo'linglar." },
  { t:"Shu kundan keyingi hayotingiz\nhamisha yaxshi kunlar, quvonch va baxtlarga\nto'la bo'lsin." },
  { t:"To'ylaringiz muborak bo'lsin!", big:true, gold:true },
];

const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

/* ============ OVOZ (WebAudio sintez) ============ */
const Snd = {
  ctx:null, master:null, fx:null, pad:null, on:false, padTimer:null, noise:null, kc:0,
  init(){
    try{
      try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch(e){}   // iPhone jim rejimda ham chalinsin
      // Telegram ichidagi iPhone brauzeri uchun: jim <audio> aylanib turadi — iOS ovozni "media" deb biladi,
      // shunda yon tomondagi jim rejim tugmasi yoqiq bo'lsa ham WebAudio eshitiladi
      try {
        const sr = 8000, n = sr, b = new ArrayBuffer(44 + n*2), v = new DataView(b);
        const w = (o, s) => { for (let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); };
        w(0,"RIFF"); v.setUint32(4,36+n*2,true); w(8,"WAVEfmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
        v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,"data"); v.setUint32(40,n*2,true);
        const a = this.unlock = new Audio(URL.createObjectURL(new Blob([b], { type:"audio/wav" })));
        a.loop = true; a.setAttribute("playsinline",""); a.setAttribute("webkit-playsinline","");
        const p = a.play(); if (p && p.catch) p.catch(()=>{});
      } catch(e){}
      const C = window.AudioContext || window.webkitAudioContext; if(!C) return;
      const ctx = this.ctx = new C();
      this.master = ctx.createGain(); this.master.gain.value = 0;
      const comp = ctx.createDynamicsCompressor(); this.master.connect(comp); comp.connect(ctx.destination);
      const d = ctx.createDelay(1.5); d.delayTime.value = .33;
      const fb = ctx.createGain(); fb.gain.value = .33;
      const lp = ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value = 2400;
      d.connect(lp); lp.connect(fb); fb.connect(d); lp.connect(this.master);
      this.fx = d;
      this.pad = ctx.createGain(); this.pad.gain.value = .5; this.pad.connect(this.master); this.pad.connect(d);
      const len = Math.floor(ctx.sampleRate*.026); this.noise = ctx.createBuffer(1, len, ctx.sampleRate);
      const nd = this.noise.getChannelData(0); for(let i=0;i<len;i++) nd[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
      if (ctx.state !== "running") ctx.resume();
      const wake = () => {
        if (this.ctx && this.ctx.state !== "running") this.ctx.resume();
        if (this.unlock && this.unlock.paused){ const p = this.unlock.play(); if (p && p.catch) p.catch(()=>{}); }
      };
      document.addEventListener("visibilitychange", () => { if (!document.hidden) wake(); });
      document.addEventListener("pointerdown", wake);
    }catch(e){ this.ctx = null; }
  },
  set(on){
    this.on = on && !!this.ctx; if(!this.ctx) return;
    if(this.ctx.state!=="running") this.ctx.resume();
    const t = this.ctx.currentTime, g = this.master.gain;
    g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(this.on ? .9 : 0, t + 3);   // 3s ichida asta
  },
  // fon musiqasi balandligi (0..1), secs ichida silliq o'tadi
  level(v, secs=1.5){
    if(!this.pad) return;
    const t = this.ctx.currentTime, g = this.pad.gain;
    g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(v, t + secs);
  },
  duck(q){ this.level(q ? 0 : .7, q ? 1.2 : 2.5); },
  // yakun: bayram qo'shig'i — D major, 116 BPM. Marimba-ohang melodiya, akkord "stab"lar, bass, yengil kick, doira va shaker (~50s)
  ending(){
    if(!this.ctx || !this.on) return;
    clearInterval(this.padTimer); this.padTimer = null;
    clearInterval(this.festTimer);
    this.level(.18, 2);
    const c = this.ctx, beat = 60/116, BARS = 24;
    const bus = c.createGain(); bus.gain.value = 0;
    const hp = c.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 30;
    bus.connect(hp); hp.connect(this.master);
    const send = c.createGain(); send.gain.value = .22; hp.connect(send); send.connect(this.fx);
    const t0 = c.currentTime + .2;
    bus.gain.setValueAtTime(0, t0); bus.gain.linearRampToValueAtTime(.95, t0 + 1.2);
    const N = { C5:554.37, D5:587.33, E5:659.25, Fs5:739.99, G5:783.99, A5:880, B5:987.77, Cs6:1108.73, D6:1174.66 };
    // har takt: [bass ildizi, akkord notalari, melodiya [[beat, nota, uzunlik]...]]
    const S = [
      [73.42, [293.66,369.99,440],  [[0,N.Fs5,1],[1,N.A5,.5],[1.5,N.B5,.5],[2,N.A5,1],[3,N.Fs5,1]]],
      [55.00, [277.18,329.63,440],  [[0,N.E5,1],[1,N.Fs5,.5],[1.5,N.A5,.5],[2,N.E5,1.5],[3.5,N.C5,.5]]],
      [61.74, [293.66,369.99,493.88],[[0,N.D5,1],[1,N.Fs5,.5],[1.5,N.B5,.5],[2,N.A5,1],[3,N.Fs5,1]]],
      [49.00, [293.66,392.00,493.88],[[0,N.G5,1],[1,N.Fs5,1],[2,N.E5,1],[3,N.D5,1]]],
      [73.42, [293.66,369.99,440],  [[0,N.Fs5,.5],[.5,N.A5,.5],[1,N.D6,1],[2,N.Cs6,.5],[2.5,N.B5,.5],[3,N.A5,1]]],
      [55.00, [277.18,329.63,440],  [[0,N.Cs6,1],[1,N.B5,.5],[1.5,N.A5,.5],[2,N.E5,2]]],
      [49.00, [293.66,392.00,493.88],[[0,N.B5,1],[1,N.A5,.5],[1.5,N.G5,.5],[2,N.Fs5,1],[3,N.E5,1]]],
      [55.00, [277.18,329.63,440],  [[0,N.E5,.5],[.5,N.Fs5,.5],[1,N.A5,1],[2,N.D6,2]]],
    ];
    // marimba/qo'ng'iroq tembri (FM): yorqin, quvnoq, yumshoq
    const mallet = (f, t, d, v=.075) => {
      const car = c.createOscillator(), mod = c.createOscillator(), mg = c.createGain(), g = c.createGain();
      car.type = "sine"; car.frequency.value = f; mod.type = "sine"; mod.frequency.value = f*4;
      mg.gain.setValueAtTime(f*2.2, t); mg.gain.exponentialRampToValueAtTime(f*.05, t+.18);
      mod.connect(mg); mg.connect(car.frequency);
      const len = Math.max(.35, d*beat*1.2);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t+.004); g.gain.exponentialRampToValueAtTime(.0001, t+len);
      car.connect(g); g.connect(bus); car.start(t); mod.start(t); car.stop(t+len+.05); mod.stop(t+len+.05);
    };
    // akkord "stab" (yengil pianino kabi)
    const stab = (fr, t, v=.022) => fr.forEach(f => {
      const o = c.createOscillator(), o2 = c.createOscillator(), g = c.createGain(), lp = c.createBiquadFilter();
      o.type = "triangle"; o.frequency.value = f; o2.type = "sawtooth"; o2.frequency.value = f; o2.detune.value = 7;
      lp.type = "lowpass"; lp.frequency.setValueAtTime(3200, t); lp.frequency.exponentialRampToValueAtTime(700, t+.25);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t+.005); g.gain.exponentialRampToValueAtTime(.0001, t+.3);
      o.connect(lp); o2.connect(lp); lp.connect(g); g.connect(bus); o.start(t); o2.start(t); o.stop(t+.32); o2.stop(t+.32);
    });
    const bass = (f, t, d=.5) => {
      const o = c.createOscillator(), o2 = c.createOscillator(), g = c.createGain(), lp = c.createBiquadFilter();
      o.type = "sine"; o.frequency.value = f; o2.type = "triangle"; o2.frequency.value = f*2;
      lp.type = "lowpass"; lp.frequency.value = 500;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.16, t+.01); g.gain.exponentialRampToValueAtTime(.0001, t+d*beat);
      o.connect(g); o2.connect(lp); lp.connect(g); g.connect(bus); o.start(t); o2.start(t); o.stop(t+d*beat+.05); o2.stop(t+d*beat+.05);
    };
    const kick = t => {
      const o = c.createOscillator(), g = c.createGain(); o.type = "sine";
      o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t+.12);
      g.gain.setValueAtTime(.32, t); g.gain.exponentialRampToValueAtTime(.0001, t+.28);
      o.connect(g); g.connect(bus); o.start(t); o.stop(t+.3);
    };
    const noiseHit = (t, freq, q, v, type="bandpass") => {
      const s = c.createBufferSource(); s.buffer = this.noise;
      const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
      const g = c.createGain(); g.gain.value = v;
      s.connect(f); f.connect(g); g.connect(bus); s.start(t);
    };
    let next = 0; const total = BARS*16;        // 16-liklar
    const sched = () => {
      const ahead = c.currentTime + .5;
      while (next < total && t0 + next*beat/4 < ahead){
        const t = t0 + next*beat/4, b = Math.floor(next/16), s = next % 16, bar = S[b % 8], full = b >= 8, beatPos = s/4;
        // melodiya
        for (const [bp, f, d] of bar[2]) if (Math.abs(bp - beatPos) < 1e-6) mallet(f, t, d, full ? .08 : .065);
        // akkord stab — off-beat'larda
        if (s % 4 === 2) stab(bar[1], t, full ? .024 : .016);
        // bass: 1-zarb ildiz, 2.5 da oktava
        if (s === 0) bass(bar[0], t, 1.2); else if (s === 6 || s === 10) bass(bar[0]*2, t, .45); else if (s === 12) bass(bar[0], t, .8);
        if (full){
          if (s === 0 || s === 8) kick(t);
          if (s === 4 || s === 12) noiseHit(t, 1800, 1.2, .07);            // doira "tak"
          if (s === 0 || s === 10) noiseHit(t, 220, 2, .06, "lowpass");     // doira "dum"
          noiseHit(t, 7000, .7, s % 4 === 2 ? .022 : .011, "highpass");     // shaker
        } else if (b >= 6 && s % 2 === 0){
          noiseHit(t, 7000, .7, .006 + (b-6)*.004, "highpass");             // kirishda asta shaker
        }
        next++;
      }
      if (next >= total){
        clearInterval(this.festTimer); this.festTimer = null;
        const end = t0 + total*beat/4;
        // oxirgi D akkord jarangi
        [293.66,369.99,440,587.33].forEach((f,k)=>mallet(f, end + k*.04, 6, .06));
        bass(73.42, end, 6);
        bus.gain.setValueAtTime(.95, end + 1); bus.gain.linearRampToValueAtTime(0, end + 6);
        setTimeout(()=>{ this.level(.2, 4); this.startPad(); }, Math.max(0, (end + 5 - c.currentTime) * 1000));
      }
    };
    sched(); this.festTimer = setInterval(sched, 100);
  },
  // salyut: uzoqdan yumshoq "gup"
  thump(){
    if(!this.on) return;
    const c=this.ctx, t=c.currentTime, o=c.createOscillator(), g=c.createGain();
    o.type="sine"; o.frequency.setValueAtTime(85,t); o.frequency.exponentialRampToValueAtTime(38,t+.28);
    g.gain.setValueAtTime(.13,t); g.gain.exponentialRampToValueAtTime(.0001,t+.32);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+.35);
    const s=c.createBufferSource(); s.buffer=this.noise; s.playbackRate.value=.35;
    const f=c.createBiquadFilter(); f.type="lowpass"; f.frequency.value=900;
    const g2=c.createGain(); g2.gain.setValueAtTime(.05,t); g2.gain.exponentialRampToValueAtTime(.0001,t+.5);
    s.connect(f); f.connect(g2); g2.connect(this.master); s.start(t);
  },
  chord(fr, dur){
    if(!this.on) return;
    const c=this.ctx, t=c.currentTime;
    const lp=c.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=1000; lp.connect(this.pad);
    fr.forEach((f,k)=>[-4,4].forEach(det=>{
      const o=c.createOscillator(), g=c.createGain(); o.type=k===0?"sine":"triangle"; o.frequency.value=f; o.detune.value=det;
      const v = k===0 ? .05 : .016;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+2); g.gain.setValueAtTime(v,t+dur-4); g.gain.linearRampToValueAtTime(0,t+dur);
      o.connect(g); g.connect(lp); o.start(t); o.stop(t+dur+.1);
    }));
  },
  tone(freq, dur, vol, type="sine", toFx=true, at=0){
    if(!this.on) return;
    const c=this.ctx, t=c.currentTime+at, o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.012); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(this.master); if(toFx) g.connect(this.fx);
    o.start(t); o.stop(t+dur+.05);
  },
  key(v=.06, every=1){
    if(!this.on || !this.noise) return;
    if ((this.kc++ % every) !== 0) return;
    const c=this.ctx, s=c.createBufferSource(); s.buffer=this.noise;
    const f=c.createBiquadFilter(); f.type="bandpass"; f.frequency.value=1800+Math.random()*1500; f.Q.value=1.1;
    const g=c.createGain(); g.gain.value=v;
    s.connect(f); f.connect(g); g.connect(this.master); s.start();
  },
  bell(f=880, v=.08){ this.tone(f,3,v); this.tone(f*2.005,2,v*.3); },
  low(){ this.tone(73.4,2.6,.2,"sine",false); },
  sweep(){
    if(!this.on) return;
    const c=this.ctx, t=c.currentTime, o=c.createOscillator(), g=c.createGain(), f=c.createBiquadFilter();
    o.type="sawtooth"; o.frequency.setValueAtTime(55,t); o.frequency.linearRampToValueAtTime(110,t+6);
    f.type="lowpass"; f.frequency.setValueAtTime(200,t); f.frequency.linearRampToValueAtTime(900,t+6);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.05,t+1.5); g.gain.linearRampToValueAtTime(0,t+7);
    o.connect(f); f.connect(g); g.connect(this.master); o.start(t); o.stop(t+7.2);
  },
  startPad(){
    if(!this.ctx || this.padTimer) return;
    const chords=[[146.83,220,277.18,329.63],[123.47,185,246.94,293.66],[98,146.83,196,246.94],[110,164.81,220,277.18]];
    let i=0;
    const play=()=>{
      if(!this.on){ i++; return; }
      const c=this.ctx, t=c.currentTime, dur=10;
      const lp=c.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=900; lp.connect(this.pad);
      chords[i%chords.length].forEach((f,k)=>{
        [-5,5].forEach(det=>{
          const o=c.createOscillator(), g=c.createGain();
          o.type=k===0?"sine":"triangle"; o.frequency.value=f; o.detune.value=det;
          const v = k===0 ? .045 : .013;
          g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+3);
          g.gain.setValueAtTime(v,t+dur-3.2); g.gain.linearRampToValueAtTime(0,t+dur);
          o.connect(g); g.connect(lp); o.start(t); o.stop(t+dur+.1);
        });
      });
      i++;
    };
    play(); this.padTimer=setInterval(play,8500);
  }
};

/* ============ RASM → ASCII ============ */
const RAMP = " .:-=+*#%@";
let cells;
function analyse(img){
  const oc = document.createElement("canvas"); oc.width = cols; oc.height = rows;
  const x = oc.getContext("2d", { willReadFrequently:true });
  let data = null;
  try { x.drawImage(img, 0, 0, cols, rows); data = x.getImageData(0,0,cols,rows).data; } catch(e){}
  const n = cols*rows, lum = new Float32Array(n); cells = new Array(n);
  for (let i=0;i<n;i++){ lum[i] = data ? (0.299*data[i*4] + 0.587*data[i*4+1] + 0.114*data[i*4+2])/255 : .5; }
  const sorted = Array.from(lum).sort((a,b)=>a-b);
  const lo = sorted[Math.floor(n*0.02)], hi = sorted[Math.floor(n*0.995)];
  const L = (xx,yy) => lum[Math.min(rows-1,Math.max(0,yy))*cols + Math.min(cols-1,Math.max(0,xx))];
  for (let yy=0; yy<rows; yy++) for (let xx=0; xx<cols; xx++){
    const i = yy*cols+xx;
    const gx = -L(xx-1,yy-1)-2*L(xx-1,yy)-L(xx-1,yy+1)+L(xx+1,yy-1)+2*L(xx+1,yy)+L(xx+1,yy+1);
    const gy = -L(xx-1,yy-1)-2*L(xx,yy-1)-L(xx+1,yy-1)+L(xx-1,yy+1)+2*L(xx,yy+1)+L(xx+1,yy+1);
    const edge = Math.min(1, Math.hypot(gx,gy)*1.5);
    let v = Math.min(1, Math.max(0, (lum[i]-lo)/(hi-lo||1)));
    v = Math.min(1, 0.06 + Math.pow(v,1.7)*0.78 + edge*0.7);
    cells[i] = { v, ch: RAMP[Math.min(RAMP.length-1, 1 + Math.floor(v*(RAMP.length-1)))],
                 col: `rgb(${Math.round(15+70*v*v)},${Math.round(60+195*v)},${Math.round(35+80*v)})` };
  }
}

/* ============ 3) KOD YOMG'IRI → RASM ============ */
const RAIN_CHARS = "0123456789ABCDEF{}<>=;:+*#$%&|/";
const rc = () => RAIN_CHARS[(Math.random()*RAIN_CHARS.length)|0];
function rainToImage(){
  const lockX = $("#lockCv").getContext("2d"), rainX = $("#rainCv").getContext("2d");
  lockX.font = `700 ${Math.round(cell*1.2)}px "JetBrains Mono", ui-monospace, monospace`;
  lockX.textAlign = "center"; lockX.textBaseline = "middle";
  const RC = 15;
  rainX.font = `500 ${RC}px "JetBrains Mono", ui-monospace, monospace`; rainX.textAlign = "center";
  const rCols = Math.ceil(VW / RC), rRows = Math.ceil(VH / RC) + 1;
  const drops = [];
  for (let c=0;c<rCols;c++){ drops.push({ col:c, y: -Math.random()*rRows*1.2, sp: .22 + Math.random()*.4 }); if (Math.random()<.5) drops.push({ col:c, y: -Math.random()*rRows*2, sp: .22 + Math.random()*.4 }); }
  const RAIN_ONLY = 2600, SWEEP = 5200, n = cols*rows;
  const order = new Array(n);
  for (let i=0;i<n;i++){ const r = (i/cols)|0; order[i] = { i, t: RAIN_ONLY + (r/rows)*SWEEP + Math.random()*650 }; }
  order.sort((a,b)=>a.t-b.t);
  let ptr = 0; const flick = [];
  const front = $("#scan");
  Object.assign(front.style, { left: rect.x+"px", width: rect.w+"px", top: "0px" });
  const T0 = performance.now(); let prev = T0, swept = false, resolved = false;
  setTimeout(()=>{ Snd.sweep(); Snd.level(1, 5); }, RAIN_ONLY);   // rasm yig'ilganda musiqa ko'tariladi
  return new Promise(resolve => {
    function frame(now){
      const dt = Math.min(50, now - prev)/16.67; prev = now; const t = now - T0;
      rainX.globalCompositeOperation = "destination-out"; rainX.fillStyle = "rgba(0,0,0,0.12)"; rainX.fillRect(0,0,VW,VH);
      rainX.globalCompositeOperation = "source-over";
      const stopRain = t > RAIN_ONLY + SWEEP + 600;
      for (const d of drops){
        if (d.dead) continue;
        const o = Math.floor(d.y); d.y += d.sp*dt; const nw = Math.floor(d.y);
        for (let r=o+1; r<=nw; r++){
          if (r<0) continue;
          const x = d.col*RC + RC/2, y = r*RC;
          rainX.fillStyle = "#1fd65f"; if (d.last) rainX.fillText(d.last, x, y-RC);
          rainX.fillStyle = "#e9ffef"; const ch = rc(); rainX.fillText(ch, x, y); d.last = ch;
        }
        if (d.y > rRows + 1){ if (stopRain) d.dead = true; else { d.y = -Math.random()*8; d.sp = .22 + Math.random()*.4; } }
      }
      const fp = (t - RAIN_ONLY)/SWEEP;
      if (fp > 0 && fp < 1.05){ front.style.opacity = .9; front.style.transform = `translateY(${rect.y + rect.h*Math.min(1,fp)}px)`; }
      else if (fp >= 1.05 && !swept){ swept = true; front.style.transition = "opacity .6s"; front.style.opacity = 0; }
      while (ptr < n && order[ptr].t <= t){ flick.push({ i: order[ptr].i, until: now + 140 }); ptr++; }
      for (let k=flick.length-1;k>=0;k--){
        const f = flick[k], i = f.i, c = cells[i], x = rect.x + (i%cols)*cell, y = rect.y + ((i/cols)|0)*cell;
        lockX.clearRect(x-.5, y-.5, cell+1, cell+1);
        if (now >= f.until){ lockX.fillStyle = c.col; lockX.fillText(c.ch, x+cell/2, y+cell/2+.5); flick.splice(k,1); }
        else { lockX.fillStyle = "#e9ffef"; lockX.fillText(rc(), x+cell/2, y+cell/2+.5); }
      }
      if (!resolved && ptr >= n && flick.length === 0){ resolved = true; resolve(); }
      if (resolved && drops.every(d=>d.dead)){ rainX.clearRect(0,0,VW,VH); return; }
      if (resolved && t > RAIN_ONLY + SWEEP + 9000){ $("#rainCv").style.transition="opacity 1s"; $("#rainCv").style.opacity=0; return; }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
}

/* ============ 5) XAT — slaydlar, teskari sanoq bilan ============ */
function parseSlide(s){
  const segs = []; let full = "";
  s.t.split(/(\[\[p:\d+\]\])/).forEach(part => {
    const m = part.match(/^\[\[p:(\d+)\]\]$/);
    if (m) segs.push({ pause: +m[1] }); else if (part){ segs.push({ text: part }); full += part; }
  });
  return { segs, full, words: full.split(/\s+/).filter(Boolean).length };
}
const PARSED = SLIDES.map(parseSlide);
function readMs(i){
  const s = SLIDES[i], p = PARSED[i];
  let T = Math.min(15000, Math.max(6000, 3000 + p.words*500));
  if (s.big) T *= 1.25; if (s.slow) T *= 1.4;
  if (i === SLIDES.length-1) T = Math.max(T, 8000);
  return T;
}
function slides(autoDefault = true){
  const box = $("#slides"), head = $("#sHead"), text = $("#sText"), next = $("#sNext"), back = $("#sBack"),
        num = $("#sNum"), bar = $("#sBarI"), lbl = $("#sLbl"), sec = $("#sSec"), fill = next.querySelector(".fill");
  box.classList.add("show");
  let idx = 0, typing = false, skip = false, token = 0, auto = autoDefault, deadline = 0, total = 0, pausedLeft = 0, quietOn = false;
  const heads = []; let lh = ""; SLIDES.forEach((s,i)=>{ if (s.h) lh = s.h; heads[i] = lh; });

  // teskari sanoq — bitta deadline, Telegramdan chiqilsa pauza
  let rafId = 0;
  const stopCount = () => { cancelAnimationFrame(rafId); deadline = 0; sec.textContent = ""; fill.style.transform = "scaleX(0)"; };
  const startCount = ms => {
    if (!auto){ stopCount(); return; }
    total = ms; deadline = performance.now() + ms;
    const my = token;
    (function tick(){
      if (my !== token || !deadline) return;
      if (document.hidden){ rafId = requestAnimationFrame(tick); return; }
      const left = deadline - performance.now();
      sec.textContent = Math.max(0, Math.ceil(left/1000)) + "s";
      fill.style.transform = `scaleX(${Math.max(0, 1 - left/total)})`;
      if (left <= 0){ deadline = 0; go(); return; }
      rafId = requestAnimationFrame(tick);
    })();
  };
  const onVis = () => {
    if (!deadline) return;
    if (document.hidden) pausedLeft = deadline - performance.now();
    else if (pausedLeft > 0){ deadline = performance.now() + pausedLeft; pausedLeft = 0; }
  };
  document.addEventListener("visibilitychange", onVis);

  async function show(i, instant=false){
    const my = ++token, s = SLIDES[i], p = PARSED[i];
    typing = true; skip = instant; stopCount();
    next.classList.remove("on"); back.style.visibility = i > 0 ? "visible" : "hidden";
    // musiqa: 10–11 slaydlarda jimlik
    const wantQuiet = !!s.quiet;
    if (wantQuiet !== quietOn){ quietOn = wantQuiet; Snd.duck(wantQuiet); }
    text.style.opacity = 0; await sleep(150); if (my !== token) return;
    head.textContent = heads[i];
    num.textContent = `${String(i+1).padStart(2,"0")} / ${SLIDES.length}`;
    bar.style.width = ((i+1)/SLIDES.length*100) + "%";
    text.className = (s.big ? "big" : "") + (s.gold ? " gold" : "");
    // to'liq matn oldindan joylanadi — yozilganda sakramaydi
    text.innerHTML = "";
    const vis = document.createElement("span"), caret = document.createElement("span"), ghost = document.createElement("span");
    caret.className = "caret"; ghost.className = "ghost"; ghost.textContent = p.full;
    text.append(vis, caret, ghost);
    text.style.opacity = 1;
    await sleep(instant ? 0 : 300); if (my !== token) return;
    const speed = s.slow ? 95 : (s.big ? 60 : 42);
    for (const seg of p.segs){
      if (seg.pause){ if (!skip) await sleep(seg.pause); if (my !== token) return; continue; }
      for (const ch of seg.text){
        if (my !== token) return;
        vis.textContent += ch; ghost.textContent = ghost.textContent.slice(1);
        if (!skip){
          if (ch !== " " && ch !== "\n") Snd.key(.03, 2);
          let d = speed + Math.random()*speed*.5;
          if (ch === "\n") d += 260; else if (".!?".includes(ch)) d += 280; else if (",—".includes(ch)) d += 140;
          await sleep(d);
        }
      }
    }
    typing = false;
    if (s.big && !instant) Snd.bell(s.gold ? 587.3 : 440, .07);
    await sleep(instant ? 0 : 400); if (my !== token) return;
    lbl.textContent = i === SLIDES.length-1 ? "yakunlash →" : "davom →";
    next.classList.add("on");
    startCount(readMs(i));
  }
  let resolveAll;
  function go(){
    if (typing){ skip = true; return; }               // yozilayotganda bosish — matn to'liq chiqadi
    if (idx < SLIDES.length-1){ idx++; show(idx); }
    else { token++; stopCount(); document.removeEventListener("visibilitychange", onVis); quietOn = false; box.classList.remove("show"); resolveAll(); }
  }
  return new Promise(resolve => {
    resolveAll = resolve;
    next.onclick = e => { e.stopPropagation(); auto = autoDefault; go(); };
    back.onclick = e => { e.stopPropagation(); if (idx > 0){ auto = false; idx--; show(idx, true); } };
    box.onclick = () => { if (typing) skip = true; else if (next.classList.contains("on")) { auto = autoDefault; go(); } };
    show(0);
  });
}

/* ============ 6) YAKUN ============ */
let bgRainOn = false;
function bgRain(){
  if (bgRainOn) return; bgRainOn = true;
  const cv = $("#bgRain"), x = cv.getContext("2d"), cs = 14; let W, H, n, ys;
  const fit = () => { W = innerWidth; H = innerHeight; cv.width = W*DPR; cv.height = H*DPR; x.setTransform(DPR,0,0,DPR,0,0);
    n = Math.ceil(W/cs); ys = Array.from({length:n}, () => Math.random()*-H/cs); x.font = `${cs}px "JetBrains Mono", monospace`; };
  fit(); addEventListener("resize", fit);
  let last = 0;
  (function f(t){
    if (t - last > 60){ last = t; x.fillStyle = "rgba(0,0,0,.12)"; x.fillRect(0,0,W,H); x.fillStyle = "#3dff7a";
      for (let i=0;i<n;i++){ x.fillText(rc(), i*cs, ys[i]*cs); ys[i]++; if (ys[i]*cs > H && Math.random() > .975) ys[i] = 0; } }
    requestAnimationFrame(f);
  })(0);
}
/* ============ SALYUT + KONFETTI ============
   Kod raketalari turli tomondan, turli burchakda uchadi va kod belgilariga yorilib portlaydi.
   Konfetti rasm ustidan ham tushadi. Ranglar: oltin, oq, yashil. */
const GLYPHS = "{}<>/;=+*#$%&01λπΣ∞[]()";
const spriteCache = new Map();
function glyphSprite(ch, col, size){
  const key = ch + col + size;
  let s = spriteCache.get(key); if (s) return s;
  const pad = Math.ceil(size*.9), d = Math.ceil(size + pad*2), cv = document.createElement("canvas");
  const r = Math.min(DPR, 2); cv.width = d*r; cv.height = d*r;
  const x = cv.getContext("2d"); x.scale(r, r);
  x.font = `700 ${size}px "JetBrains Mono", ui-monospace, monospace`; x.textAlign = "center"; x.textBaseline = "middle";
  x.shadowColor = col; x.shadowBlur = size*.7; x.fillStyle = col; x.fillText(ch, d/2, d/2);
  x.shadowBlur = 0; x.fillStyle = "#fff"; x.globalAlpha = .55; x.fillText(ch, d/2, d/2);
  s = { cv, d }; spriteCache.set(key, s); return s;
}
let celebrateRun = 0;
function celebrate(full){
  const run = ++celebrateRun;
  const cv = $("#fx"), x = cv.getContext("2d"), dpr = Math.min(DPR, 1.5);
  const W = innerWidth, H = innerHeight;
  cv.width = W*dpr; cv.height = H*dpr; x.setTransform(dpr,0,0,dpr,0,0);
  const K = lowEnd ? .55 : 1, S = Math.min(W, H) / 400;
  const GOLD = ["#f2cf7e","#ffe7a8","#fff4dc"], GREEN = "#3dff7a", WHITE = "#ffffff";
  const SIZES = [10, 13, 16].map(v => Math.round(v*Math.max(.9, S)));
  const rnd = (a, b) => a + Math.random()*(b-a), pick = a => a[(Math.random()*a.length)|0];

  // raketalar jadvali
  const plan = [];
  if (full){
    [0.15,0.55,0.9,1.3,1.75,2.1,2.5,2.9,3.3].forEach(t => plan.push(t));          // qora osmonda kuchli ochilish
    for (let t = 4.6; t < 19; t += rnd(1.3, 2.3)) plan.push(t);                       // rasm paydo bo'lgach davom etadi
    [19.2, 19.35, 19.5, 19.8].forEach(t => plan.push(t));                             // yakuniy guldasta
  } else [0.2, 0.8, 1.5, 2.4].forEach(t => plan.push(t));
  const rockets = plan.map((t, k) => {
    const side = Math.random();
    const sx = side < .33 ? rnd(-.05, .2)*W : side < .66 ? rnd(.8, 1.05)*W : rnd(.3, .7)*W;   // chapdan, o'ngdan, pastdan
    const tx = rnd(.12, .88)*W, ty = rnd(.08, .42)*H;
    return { t, sx, sy: H + 20, tx, ty, cx: (sx + tx)/2 + rnd(-.25, .25)*W, cy: rnd(.45, .8)*H,
             dur: rnd(.7, 1.05), type: pick(["sphere","ring","double","willow","sphere","double"]), trail: [], done: false, loud: k % 2 === 0 };
  });
  const parts = [], conf = [];
  // konfetti to'lqinlari (rasm ustidan ham)
  const waves = full ? [0.4, 4.4, 9, 14] : [0.3];
  const confQ = [];
  waves.forEach((w, i) => { const n = Math.round((i === 0 ? 70 : 45)*K); for (let k=0;k<n;k++) confQ.push(w + Math.random()*2.2); });
  confQ.sort((a,b)=>a-b); let cq = 0;
  const CONF = ["#e3c27a","#f0d9a0","#f3ead8","#ffffff","#3dff7a"];

  const burst = r => {
    if (r.loud) Snd.thump();
    const n = Math.round((r.type === "ring" ? 46 : r.type === "willow" ? 60 : 72)*K);
    const base = pick(GOLD);
    for (let i=0;i<n;i++){
      let a, sp, col = pick(GOLD), size = pick(SIZES), drag = .983, grav = .03, life = rnd(1.3, 2.1);
      if (r.type === "ring"){ a = i/n*Math.PI*2; sp = 4.2*S; col = base; }
      else if (r.type === "double"){ a = Math.random()*Math.PI*2; const inner = i < n*.35; sp = (inner ? rnd(1.2,2.2) : rnd(3.6,4.8))*S; col = inner ? GREEN : pick(GOLD); }
      else if (r.type === "willow"){ a = Math.random()*Math.PI*2; sp = rnd(1.8, 3.8)*S; drag = .972; grav = .05; life = rnd(2.2, 3); col = "#f2cf7e"; }
      else { a = Math.random()*Math.PI*2; sp = rnd(1.4, 4.6)*S; if (Math.random() < .12) col = Math.random() < .5 ? GREEN : WHITE; }
      parts.push({ x: r.tx, y: r.ty, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life, max: life, drag, grav, col, size,
                   ch: GLYPHS[(Math.random()*GLYPHS.length)|0], rot: rnd(-.5,.5), vr: rnd(-.08,.08) });
    }
    // markazda qisqa chaqnash
    parts.push({ flash: true, x: r.tx, y: r.ty, life: .25, max: .25 });
  };

  const T0 = performance.now(); let prev = T0;
  (function f(now){
    if (run !== celebrateRun) return;
    if (document.hidden){ prev = now; requestAnimationFrame(f); return; }
    const dt = Math.min(50, now - prev)/16.67, sec = Math.min(50, now - prev)/1000; prev = now;
    const t = (now - T0)/1000;
    x.clearRect(0,0,W,H);
    x.globalCompositeOperation = "lighter";
    // raketalar — yashil kod izi bilan egri yo'l
    for (const r of rockets){
      if (r.done || t < r.t) continue;
      const p = Math.min(1, (t - r.t)/r.dur), e = 1 - Math.pow(1-p, 2.2), u = 1 - e;
      const px = u*u*r.sx + 2*u*e*r.cx + e*e*r.tx, py = u*u*r.sy + 2*u*e*r.cy + e*e*r.ty;
      r.trail.push({ x: px, y: py, ch: Math.random() < .5 ? "1" : "0", a: 1 });
      for (const s of r.trail){
        s.a -= .055*dt; if (s.a <= 0) continue;
        const sp = glyphSprite(s.ch, GREEN, SIZES[0]);
        x.globalAlpha = s.a*.9; x.drawImage(sp.cv, s.x - sp.d/2, s.y - sp.d/2, sp.d, sp.d);
      }
      if (p >= 1){ r.done = true; burst(r); }
    }
    // portlash belgilari
    for (let i = parts.length-1; i >= 0; i--){
      const q = parts[i];
      q.life -= sec;
      if (q.life <= 0){ parts.splice(i,1); continue; }
      const k = q.life / q.max;
      if (q.flash){
        const g = x.createRadialGradient(q.x, q.y, 0, q.x, q.y, 60*S);
        g.addColorStop(0, `rgba(255,240,200,${.5*k})`); g.addColorStop(1, "rgba(255,240,200,0)");
        x.globalAlpha = 1; x.fillStyle = g; x.fillRect(q.x - 60*S, q.y - 60*S, 120*S, 120*S); continue;
      }
      const dr = Math.pow(q.drag, dt); q.vx *= dr; q.vy = q.vy*dr + q.grav*dt*S;
      q.x += q.vx*dt; q.y += q.vy*dt; q.rot += q.vr*dt;
      let a = Math.pow(k, 1.2); if (k < .35 && Math.random() < .35) a *= .2;   // oxirida chirsillab so'nadi
      const sp = glyphSprite(q.ch, q.col, q.size), sc = .55 + .45*k;
      x.globalAlpha = a;
      x.save(); x.translate(q.x, q.y); x.rotate(q.rot); x.scale(sc, sc); x.drawImage(sp.cv, -sp.d/2, -sp.d/2, sp.d, sp.d); x.restore();
    }
    // konfetti — oltin folga lentalar, rasm ustidan
    x.globalCompositeOperation = "source-over";
    while (cq < confQ.length && confQ[cq] <= t){
      conf.push({ x: Math.random()*W, y: -14, vy: rnd(1.4, 2.6)*S, ph: Math.random()*6.28, sp: rnd(.08,.18), sw: Math.random()*6.28,
                  rot: rnd(-.8,.8), col: pick(CONF), w: rnd(3,4.5), h: rnd(8,12) });
      cq++;
    }
    for (let i = conf.length-1; i >= 0; i--){
      const p = conf[i];
      p.y += p.vy*dt; p.sw += .035*dt; p.ph += p.sp*dt; p.x += Math.sin(p.sw)*.6*dt;
      if (p.y > H + 20){ conf.splice(i,1); continue; }
      const w = p.w*Math.abs(Math.cos(p.ph)) + .7, shade = .7 + .3*Math.abs(Math.cos(p.ph));
      x.save(); x.translate(p.x, p.y); x.rotate(p.rot + Math.sin(p.sw)*.5);
      x.globalAlpha = .92*shade; x.fillStyle = p.col; x.fillRect(-w/2, -p.h/2, w, p.h); x.restore();
    }
    x.globalAlpha = 1;
    const busy = rockets.some(r => !r.done) || parts.length || conf.length || cq < confQ.length;
    if (busy) requestAnimationFrame(f); else { x.clearRect(0,0,W,H); $("#bgRain").style.opacity = .14; }
  })(T0);
  $("#bgRain").style.opacity = .06;
}
let finaleCount = 0;
function finale(){
  $("#fNames").innerHTML = `${esc(CONFIG.aka)}<span class="amp">&amp;</span>${esc(CONFIG.kelin)}`;
  $("#fSign").textContent = `// ukang · Koreya → O'zbekiston · ${CONFIG.sana}`;
  finaleCount++;
  const first = finaleCount === 1;
  // avval qora osmonda salyut, keyin rasm va ismlar paydo bo'ladi (salyut yuzlar ustiga tushmaydi)
  $("#final").classList.add("pre", "show");
  bgRain(); Snd.ending();
  setTimeout(() => celebrate(first), 400);
  setTimeout(() => $("#final").classList.remove("pre"), first ? 3900 : 1800);
}
$("#replay").addEventListener("click", () => location.reload());
$("#reread").addEventListener("click", async e => {
  e.stopPropagation(); $("#final").classList.remove("show"); await sleep(900);
  Snd.level(.7, 2); await slides(true); finale();
});
