<style>
  :root{
    --green:#3dff7a; --green2:#22c55e; --gdim:#3f7a52; --gold:#e3c27a; --text:#f0f3f6; --grey:#7d8590;
    --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
    --arabic:"Amiri","Traditional Arabic",serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#000;color:var(--text);overflow:hidden}
  body{font-family:var(--mono);-webkit-font-smoothing:antialiased;touch-action:manipulation}
  #stage{position:fixed;inset:0;height:100dvh;overflow:hidden}
  canvas.layer{position:absolute;left:0;top:0;pointer-events:none}
  #photo{position:absolute;opacity:0;pointer-events:none;-webkit-user-drag:none;transition:opacity 1.4s, filter 1.4s}
  #scan{position:absolute;height:1px;background:#bfffd3;box-shadow:0 0 14px 2px rgba(61,255,122,.55);opacity:0;pointer-events:none}
  .cur::after{content:"█";animation:blink 1s steps(1) infinite;margin-left:1px;color:var(--green)}
  @keyframes blink{50%{opacity:0}}
  @keyframes fadeIn{to{opacity:1}}

  /* start */
  #start{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 22px;gap:30px;color:var(--green);z-index:20;transition:opacity .6s}
  #start .lines{font-size:15px;line-height:1.9;max-width:560px;margin:0 auto;width:100%}
  #start .lines div{opacity:0;animation:fadeIn .25s forwards}
  #start .muted{color:var(--gdim)}
  .btns{display:flex;flex-direction:column;gap:12px;max-width:560px;margin:0 auto;width:100%;opacity:0;animation:fadeIn .5s 1.6s forwards}
  .btn{font-family:var(--mono);font-size:16px;padding:16px;border-radius:6px;border:1px solid var(--green2);background:transparent;color:var(--green);cursor:pointer;text-align:left}
  .btn.ghost{border-color:#1b3a26;color:var(--gdim);font-size:13px;padding:12px 16px}

  /* terminal */
  #term{position:absolute;inset:0;padding:calc(24px + env(safe-area-inset-top)) 18px 28px;display:flex;flex-direction:column;justify-content:flex-end;
        color:#c9d1d9;font-size:14px;line-height:1.75;z-index:12;opacity:0;transition:opacity .7s;pointer-events:none;overflow:hidden}
  #term .inner{max-width:640px;margin:0 auto;width:100%}
  #term .p{color:var(--green)} #term .h{color:#e3b341} #term .t{color:var(--grey)} #term .w{color:#fff;font-weight:700}
  #term .big{font-size:19px;color:#fff;margin-top:6px;line-height:1.5}
  #term .row{white-space:pre-wrap;word-break:break-word}

  /* verse */
  #verse{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
         padding:0 20px;z-index:13;opacity:0;transition:opacity 1.4s;pointer-events:none;background:rgba(0,0,0,.8)}
  #verse .ar{font-family:var(--arabic);font-size:clamp(40px,11vw,72px);color:var(--gold);direction:rtl;line-height:1.7}
  #verse .tr{font-size:clamp(18px,5vw,24px);color:#fff;margin-top:16px;line-height:1.5}
  #verse .ref{font-size:12px;color:var(--grey);margin-top:10px}

  /* slides */
  #slides{position:absolute;inset:0;z-index:14;background:#000;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity 1s}
  #slides.show{opacity:1;pointer-events:auto}
  #sTop{display:flex;justify-content:space-between;align-items:center;padding:calc(16px + env(safe-area-inset-top)) 20px 0;font-size:12px;color:var(--grey);min-height:44px}
  #sHead{color:var(--green2)}
  #sBody{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 24px;max-width:640px;width:100%;margin:0 auto}
  #sCard{font-size:14px;border:1px solid #21262d;background:#0d1117;border-radius:8px;padding:12px 14px;margin-bottom:26px;display:none;line-height:1.8}
  #sCard .f{color:var(--grey);font-size:12px;border-bottom:1px solid #21262d;padding-bottom:6px;margin-bottom:8px}
  #sCard .k{color:#ff7b72} #sCard .v{color:#a5d6ff} #sCard .gold{color:var(--gold);font-weight:700}
  #sText{font-size:clamp(21px,5.9vw,28px);line-height:1.6;color:var(--text);white-space:pre-wrap;word-break:break-word;min-height:3em}
  #sText.big{font-size:clamp(28px,8.4vw,44px);font-weight:700;line-height:1.35;color:#fff}
  #sText.big.gold{color:var(--gold)}
  #sText .caret{display:inline-block;width:.5em;height:1.05em;background:var(--green);vertical-align:-0.12em;margin-left:2px;animation:blink 1s steps(1) infinite}
  #sBot{display:flex;justify-content:space-between;align-items:center;padding:0 20px calc(22px + env(safe-area-inset-bottom));gap:12px}
  #sNum{font-size:12px;color:var(--grey);min-width:60px}
  #sBack{font-family:var(--mono);font-size:13px;color:var(--grey);background:none;border:none;padding:12px 6px;cursor:pointer;visibility:hidden}
  #sNext{font-family:var(--mono);font-size:16px;color:#000;background:var(--green);border:none;border-radius:6px;padding:14px 22px;cursor:pointer;
         opacity:0;transform:translateY(6px);transition:opacity .35s, transform .35s;pointer-events:none;font-weight:700}
  #sNext.on{opacity:1;transform:none;pointer-events:auto;animation:nudge 2.4s 1.5s ease-in-out infinite}
  @keyframes nudge{0%,100%{transform:none}50%{transform:translateX(4px)}}
  #sBar{height:2px;background:#161b22;margin:0 20px 14px}
  #sBar i{display:block;height:100%;width:0;background:var(--green2);transition:width .5s}

  /* final — bitta ekranga sig'adi */
  #final{position:absolute;inset:0;z-index:16;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;text-align:center;
         padding:calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));opacity:0;pointer-events:none;transition:opacity 1.8s;background:#000}
  #final.show{opacity:1;pointer-events:auto}
  #bgRain{position:absolute;inset:0;z-index:0;opacity:.14;pointer-events:none}
  #final > *:not(canvas){position:relative;z-index:2}
  #final .photo{border:1px solid #2b3a30;padding:5px;background:#050805}
  #final .photo img{display:block;height:min(52dvh,560px);width:auto;max-width:86vw;object-fit:cover}
  #final .names{font-size:clamp(22px,6.6vw,34px);color:#fff;margin-top:18px;font-weight:700;white-space:nowrap}
  #final .names .amp{color:var(--green);font-weight:400;margin:0 .35em}
  #final .sub{font-size:clamp(16px,4.6vw,20px);color:var(--gold);margin-top:8px}
  #final .sign{margin-top:14px;font-size:13px;color:var(--grey)}
  #final .acts{display:flex;gap:10px;justify-content:center;margin-top:18px}
  #final button{font-family:var(--mono);font-size:13px;color:var(--green);background:transparent;border:1px solid #1d5e33;padding:10px 14px;border-radius:6px;cursor:pointer}

  #snd{position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px;z-index:30;height:28px;padding:0 9px;border-radius:4px;
       border:1px solid #1f3a28;background:rgba(0,0,0,.6);color:var(--gdim);font-family:var(--mono);font-size:11px;cursor:pointer;display:none}
  #slides.show ~ #snd{top:auto;bottom:calc(84px + env(safe-area-inset-bottom))}
</style>
</head>
<body>
<div id="stage">
  <canvas id="lockCv" class="layer"></canvas>
  <img id="photo" src="juftlik.jpg" alt="Kuyov va kelin" decoding="async">
  <canvas id="rainCv" class="layer"></canvas>
  <div id="scan"></div>

  <div id="start">
    <div class="lines" id="startLines"></div>
    <div class="btns">
      <button class="btn" id="goSound">▶ ochish <span style="color:var(--gdim)">(ovoz bilan)</span></button>
      <button class="btn ghost" id="goMute">ovozsiz ochish</button>
    </div>
  </div>

  <div id="term"><div class="inner" id="termInner"></div></div>

  <div id="verse">
    <div class="ar">وَخَلَقْنَاكُمْ أَزْوَاجًا</div>
    <div class="tr">«Va sizlarni juft qilib yaratdik»</div>
    <div class="ref">Naba surasi, 8-oyat</div>
  </div>

  <div id="slides">
    <div id="sTop"><span id="sHead"></span><span></span></div>
    <div id="sBody">
      <div id="sCard"></div>
      <div id="sText"></div>
    </div>
    <div id="sBar"><i id="sBarI"></i></div>
    <div id="sBot">
      <button id="sBack">← orqaga</button>
      <span id="sNum"></span>
      <button id="sNext">davom →</button>
    </div>
  </div>

  <div id="final">
    <canvas id="bgRain"></canvas>
    <div class="photo"><img src="juftlik.jpg" alt="Kuyov va kelin"></div>
    <div class="names" id="fNames"></div>
    <div class="sub">To'ylaringiz muborak bo'lsin!</div>
    <div class="sign" id="fSign"></div>
    <div class="acts">
      <button id="reread">xatni qayta o'qish</button>
      <button id="replay">boshidan</button>
    </div>
  </div>

  <button id="snd">ovoz: on</button>
</div>

<noscript>
  <div style="position:fixed;inset:0;overflow:auto;background:#000;color:#eee;padding:20px;text-align:center;font-family:monospace">
    <img src="juftlik.jpg" alt="" style="max-width:100%"><h2>To'ying muborak, akam!</h2><p>— ukang</p>
  </div>
</noscript>

<script>
/* ============ SOZLAMALAR ============ */
const CONFIG = { aka: "Muhammadrizo", kelin: "Rano", kelinMurojaat: "kennayam", sana: "08.11.2026" };

/* ============ XAT — slaydlar ============
   h: bo'lim sarlavhasi,  big: katta,  gold: oltin,  author: "muallif" kartasi */
const SLIDES = [
  { h:"// 01 — bugun", t:"Assalomu alaykum, akam." },
  { t:"Bugun to'ying.\nEng uzoq kutilgan kun." },
  { t:"Seni chin qalbimdan tabriklayman, aka.\nChin yuragimdan baxt tilayman." },
  { t:"To'yingni telefonda kuzatib o'tirdim.\nSeni kuyov kiyimida ko'rib juda xursand bo'ldim.\nSenga juda yarashibdi." },
  { t:"To'yingda ukang bo'lib oldingda turishni,\nhammasini o'z ko'zim bilan ko'rishni juda xohlagandim.\nAfsus, bo'lmadi." },
  { t:"Lekin telefonda bo'lsa ham ko'rganimdan xursandman.\nTo'ying men kutganimdan ham zo'r o'tdi." },

  { h:"// 02 — shu sahifa", t:"Bu sahifani o'zim yasadim.\nHar bir qatorini." },
  { t:"Lekin bir narsani bilib qo'y..." },
  { author:true, t:"Buni aslida sen yasagansan.", big:true },
  { t:"Bugun men Koreyada o'tirib\nshunaqa narsalar yasay olayotgan bo'lsam —\nbunga sen sababchisan." },
  { t:"Shu kungacha eng ko'p qiyinchilikni sen ko'rding.\nEng og'ir sinovlardan sen o'tding.\nLekin hech qachon taslim bo'lmading." },
  { t:"Biz uchun qo'lingdan kelganini qilding.\nMeni har doim, har tomonlama qo'llab-quvvatlading.\nHozirgacha ham." },
  { t:"Shuning uchun bu sahifa —\nfaqat mening sovg'am emas.\nBu sening qilgan mehnatingning natijasi.", big:false },

  { h:"// 03 — sen haqingda", t:"Sendek akam borligidan faxrlanaman.\nKo'p narsada menga o'rnak bo'lgansan." },
  { t:"Sen men uchun\ndunyodagi eng zo'r akasan.", big:true },
  { t:"Seni yaxshi ko'raman, akam.\nHammasi uchun rahmat.", big:true, gold:true, slow:true },
  { t:"Va'da beraman —\ninshaalloh, qilgan yaxshiliklaringning\nrohatini hali ko'rasizlar." },

  { h:"// 04 — ikkovingizga", t:`Akam, ${CONFIG.kelin} ${CONFIG.kelinMurojaat} —\nikkovingizni ham chin yurakdan tabriklayman.` },
  { t:"Baxtli bo'linglar.\nQo'sha qaringlar." },
  { t:"Uzoq umr ko'ringlar,\ndoim sog'-salomat bo'linglar." },
  { t:"Shu kundan keyingi hayotingiz\nfaqat yaxshi kunlar, quvonch va baxtga\nto'la bo'lsin." },
  { t:"To'ylaringiz muborak bo'lsin!", big:true, gold:true },
];

const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

/* ============ OVOZ (WebAudio sintez) ============ */
const Snd = {
  ctx:null, master:null, fx:null, on:false, padTimer:null,
  init(){
    try{
      const C = window.AudioContext || window.webkitAudioContext; if(!C) return;
      const ctx = this.ctx = new C();
      this.master = ctx.createGain(); this.master.gain.value = 0;
      const comp = ctx.createDynamicsCompressor(); this.master.connect(comp); comp.connect(ctx.destination);
      const d = ctx.createDelay(1.5); d.delayTime.value = .33;
      const fb = ctx.createGain(); fb.gain.value = .33;
      const lp = ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value = 2400;
      d.connect(lp); lp.connect(fb); fb.connect(d); lp.connect(this.master);
      this.fx = d;
      if (ctx.state === "suspended") ctx.resume();
    }catch(e){ this.ctx = null; }
  },
  set(on){
    this.on = on && !!this.ctx; if(!this.ctx) return;
    if(this.ctx.state==="suspended") this.ctx.resume();
    this.master.gain.setTargetAtTime(this.on ? .9 : 0, this.ctx.currentTime, .3);
    $("#snd").textContent = "ovoz: " + (this.on ? "on" : "off");
  },
  tone(freq, dur, vol, type="sine", toFx=true, at=0){
    if(!this.on) return;
    const c=this.ctx, t=c.currentTime+at, o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.012); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(this.master); if(toFx) g.connect(this.fx);
    o.start(t); o.stop(t+dur+.05);
  },
  key(v=.07){
    if(!this.on) return;
    const c=this.ctx, t=c.currentTime, len=.026, buf=c.createBuffer(1, Math.floor(c.sampleRate*len), c.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);
    const s=c.createBufferSource(); s.buffer=buf;
    const f=c.createBiquadFilter(); f.type="bandpass"; f.frequency.value=1800+Math.random()*1500; f.Q.value=1.1;
    const g=c.createGain(); g.gain.value=v;
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t);
  },
  bell(f=880, v=.08){ this.tone(f,3,v); this.tone(f*2.005,2,v*.3); },
  low(){ this.tone(73.4,2.6,.2,"sine",false); },
  sweep(){ // rasm yig'ilayotganda past shovqin
    if(!this.on) return;
    const c=this.ctx, t=c.currentTime, o=c.createOscillator(), g=c.createGain(), f=c.createBiquadFilter();
    o.type="sawtooth"; o.frequency.setValueAtTime(55,t); o.frequency.linearRampToValueAtTime(110,t+6);
    f.type="lowpass"; f.frequency.setValueAtTime(200,t); f.frequency.linearRampToValueAtTime(900,t+6);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.05,t+1.5); g.gain.linearRampToValueAtTime(0,t+7);
    o.connect(f); f.connect(g); g.connect(this.master); o.start(t); o.stop(t+7.2);
  },
  startPad(){
    if(!this.ctx || this.padTimer) return;
    const chords=[[146.83,220,277.18,329.63],[123.47,185,246.94,293.66],[98,146.83,196,246.94],[110,164.81,220,277.18]];
    let i=0;
    const play=()=>{
      if(!this.on){ i++; return; }
      const c=this.ctx, t=c.currentTime, dur=10;
      const lp=c.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=900; lp.connect(this.master); lp.connect(this.fx);
      chords[i%chords.length].forEach((f,k)=>{
        [-5,5].forEach(det=>{
          const o=c.createOscillator(), g=c.createGain();
          o.type=k===0?"sine":"triangle"; o.frequency.value=f; o.detune.value=det;
          const v = k===0 ? .045 : .013;
          g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+3);
          g.gain.setValueAtTime(v,t+dur-3.2); g.gain.linearRampToValueAtTime(0,t+dur);
          o.connect(g); g.connect(lp); o.start(t); o.stop(t+dur+.1);
        });
      });
      i++;
    };
    play(); this.padTimer=setInterval(play,8500);
  }
};
$("#snd").addEventListener("pointerdown", e => { e.stopPropagation(); Snd.set(!Snd.on); if(Snd.on) Snd.startPad(); });

/* ============ LAYOUT ============ */
const DPR = Math.min(window.devicePixelRatio || 1, 2);
const IMG_AR = 964/1280;
let VW, VH, cell, rect, cols, rows;
function layout(){
  VW = innerWidth; VH = innerHeight;
  let w = VW, h = w / IMG_AR;
  if (h > VH * 0.94) { h = VH * 0.94; w = h * IMG_AR; }
  cell = Math.max(4, Math.round(w / 96));
  cols = Math.floor(w / cell); rows = Math.floor(h / cell);
  w = cols*cell; h = rows*cell;
  rect = { x: Math.round((VW - w)/2), y: Math.round((VH - h)/2), w, h };
  for (const id of ["lockCv","rainCv"]) {
    const c = document.getElementById(id);
    c.width = VW * DPR; c.height = VH * DPR; c.style.width = VW + "px"; c.style.height = VH + "px";
    c.getContext("2d").setTransform(DPR,0,0,DPR,0,0);
  }
  Object.assign($("#photo").style, { left: rect.x+"px", top: rect.y+"px", width: rect.w+"px", height: rect.h+"px" });
}

/* ============ RASM → ASCII ============ */
const RAMP = " .:-=+*#%@";
let cells;
function analyse(img){
  const oc = document.createElement("canvas"); oc.width = cols; oc.height = rows;
  const x = oc.getContext("2d", { willReadFrequently:true });
  x.drawImage(img, 0, 0, cols, rows);
  let data = null; try { data = x.getImageData(0,0,cols,rows).data; } catch(e){}
  const n = cols*rows, lum = new Float32Array(n); cells = new Array(n);
  for (let i=0;i<n;i++){ lum[i] = data ? (0.299*data[i*4] + 0.587*data[i*4+1] + 0.114*data[i*4+2])/255 : .5; }
  const sorted = Array.from(lum).sort((a,b)=>a-b);
  const lo = sorted[Math.floor(n*0.02)], hi = sorted[Math.floor(n*0.995)];
  const L = (xx,yy) => lum[Math.min(rows-1,Math.max(0,yy))*cols + Math.min(cols-1,Math.max(0,xx))];
  for (let yy=0; yy<rows; yy++) for (let xx=0; xx<cols; xx++){
    const i = yy*cols+xx;
    const gx = -L(xx-1,yy-1)-2*L(xx-1,yy)-L(xx-1,yy+1)+L(xx+1,yy-1)+2*L(xx+1,yy)+L(xx+1,yy+1);
    const gy = -L(xx-1,yy-1)-2*L(xx,yy-1)-L(xx+1,yy-1)+L(xx-1,yy+1)+2*L(xx,yy+1)+L(xx+1,yy+1);
    const edge = Math.min(1, Math.hypot(gx,gy)*1.5);
    let v = Math.min(1, Math.max(0, (lum[i]-lo)/(hi-lo||1)));
    v = Math.min(1, 0.06 + Math.pow(v,1.7)*0.78 + edge*0.7);
    cells[i] = { v, ch: RAMP[Math.min(RAMP.length-1, 1 + Math.floor(v*(RAMP.length-1)))],
                 col: `rgb(${Math.round(15+70*v*v)},${Math.round(60+195*v)},${Math.round(35+80*v)})` };
  }
}

/* ============ 1) START ============ */
function startScreen(){
  const lines = [
    `<span class="muted">~/akamga $</span> ls`,
    `rasm.jpg   xat.txt   akamga`,
    `<span class="muted">~/akamga $</span> cat README`,
    `Kimga: ${esc(CONFIG.aka)} akamga.`,
    `Kimdan: ukangdan.`,
  ];
  const box = $("#startLines");
  lines.forEach((l,i)=>{ const d=document.createElement("div"); d.innerHTML=l; d.style.animationDelay=(0.15+i*0.28)+"s"; box.appendChild(d); });
  return new Promise(res=>{
    const go = withSound => e => {
      e.stopPropagation();
      Snd.init(); Snd.set(withSound); $("#snd").style.display="block";
      if (withSound) Snd.startPad();
      res();
    };
    $("#goSound").addEventListener("click", go(true), { once:true });
    $("#goMute").addEventListener("click", go(false), { once:true });
  });
}

/* ============ 2) TERMINAL ============ */

}

/* ============ 3) KOD YOMG'IRI → RASM (tepadan pastga aniq yig'iladi) ============ */
const RAIN_CHARS = "01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワン0123456789ABCDEFZ<>{}=+*#$%";
const rc = () => RAIN_CHARS[(Math.random()*RAIN_CHARS.length)|0];
function rainToImage(){
  const lockX = $("#lockCv").getContext("2d"), rainX = $("#rainCv").getContext("2d");
  lockX.font = `700 ${Math.round(cell*1.2)}px "JetBrains Mono", ui-monospace, monospace`;
  lockX.textAlign = "center"; lockX.textBaseline = "middle";
  const RC = 15; // yomg'ir belgisi o'lchami
  rainX.font = `500 ${RC}px "JetBrains Mono", ui-monospace, monospace`; rainX.textAlign = "center";
  const rCols = Math.ceil(VW / RC), rRows = Math.ceil(VH / RC) + 1;
  const drops = [];
  for (let c=0;c<rCols;c++){ drops.push({ col:c, y: -Math.random()*rRows*1.2, sp: .22 + Math.random()*.4 }); if (Math.random()<.5) drops.push({ col:c, y: -Math.random()*rRows*2, sp: .22 + Math.random()*.4 }); }

  // har bir katak qachon "qotishi" — front tepadan pastga yuradi
  const RAIN_ONLY = 2600, SWEEP = 5200, n = cols*rows;
  const order = new Array(n);
  for (let i=0;i<n;i++){ const r = (i/cols)|0; order[i] = { i, t: RAIN_ONLY + (r/rows)*SWEEP + Math.random()*650, drawn:0 }; }
  order.sort((a,b)=>a.t-b.t);
  let ptr = 0; const flick = [];
  const front = $("#scan");
  Object.assign(front.style, { left: rect.x+"px", width: rect.w+"px" });
  const T0 = performance.now(); let prev = T0, swept = false, resolved = false;
  setTimeout(()=>Snd.sweep(), RAIN_ONLY);
  return new Promise(resolve => {
    function frame(now){
      const dt = Math.min(50, now - prev)/16.67; prev = now; const t = now - T0;
      // yomg'ir
      rainX.globalCompositeOperation = "destination-out"; rainX.fillStyle = "rgba(0,0,0,0.12)"; rainX.fillRect(0,0,VW,VH);
      rainX.globalCompositeOperation = "source-over";
      const stopRain = t > RAIN_ONLY + SWEEP + 600;
      for (const d of drops){
        const o = Math.floor(d.y); d.y += d.sp*dt; const nw = Math.floor(d.y);
        for (let r=o+1; r<=nw; r++){
          if (r<0) continue;
          const x = d.col*RC + RC/2, y = r*RC;
          rainX.fillStyle = "#1fd65f"; if (d.last) rainX.fillText(d.last, x, y-RC);
          rainX.fillStyle = "#e9ffef"; const ch = rc(); rainX.fillText(ch, x, y); d.last = ch;
        }
        if (d.y > rRows + 1){ if (stopRain) d.dead = true; else { d.y = -Math.random()*8; d.sp = .22 + Math.random()*.4; } }
      }
      // front chizig'i
      const fp = (t - RAIN_ONLY)/SWEEP;
      if (fp > 0 && fp < 1.05){ front.style.opacity = .9; front.style.top = (rect.y + rect.h*Math.min(1,fp)) + "px"; }
      else if (fp >= 1.05 && !swept){ swept = true; front.style.transition = "opacity .6s"; front.style.opacity = 0; }
      // qotish
      while (ptr < n && order[ptr].t <= t){ flick.push({ i: order[ptr].i, until: now + 140 }); ptr++; }
      for (let k=flick.length-1;k>=0;k--){
        const f = flick[k], i = f.i, c = cells[i], x = rect.x + (i%cols)*cell, y = rect.y + ((i/cols)|0)*cell;
        lockX.clearRect(x-.5, y-.5, cell+1, cell+1);
        if (now >= f.until){ lockX.fillStyle = c.col; lockX.fillText(c.ch, x+cell/2, y+cell/2+.5); flick.splice(k,1); }
        else { lockX.fillStyle = "#e9ffef"; lockX.fillText(rc(), x+cell/2, y+cell/2+.5); }
      }
      if (!resolved && ptr >= n && flick.length === 0){ resolved = true; resolve(); }
      if (resolved && drops.every(d=>d.dead)){ rainX.clearRect(0,0,VW,VH); return; }
      if (resolved && t > RAIN_ONLY + SWEEP + 9000){ $("#rainCv").style.transition="opacity 1s"; $("#rainCv").style.opacity=0; return; }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
}

/* ASCII → haqiqiy rasm (pastdan tepaga emas, tepadan pastga skaner) */
async function revealPhoto(){
  await sleep(2200);                       // kod rasmni bir oz ko'rsin
  const ph = $("#photo"), scan = $("#scan");
  ph.style.transition = "none"; ph.style.opacity = 1;
  const setMask = pos => { const m = `linear-gradient(to bottom, #000 0%, #000 ${pos}%, transparent ${pos+4}%)`; ph.style.webkitMaskImage = m; ph.style.maskImage = m; };
  setMask(-5);
  scan.style.transition = "none"; scan.style.opacity = .9;
  Snd.bell(587.3,.06);
  const D = 2400, t0 = performance.now();
  await new Promise(r => (function f(){
    const p = Math.min(1,(performance.now()-t0)/D), e = p<.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2, pos = e*110 - 5;
    setMask(pos); scan.style.top = (rect.y + rect.h*Math.max(0,Math.min(1,pos/100))) + "px";
    p<1 ? requestAnimationFrame(f) : r();
  })());
  ph.style.webkitMaskImage = ph.style.maskImage = "none";
  scan.style.transition = "opacity .6s"; scan.style.opacity = 0;
  $("#lockCv").style.transition = "opacity 1s"; $("#lockCv").style.opacity = 0;
  await sleep(3200);
}

/* ============ 5) XAT — slaydlar, faqat bosilganda o'tadi ============ */
function slides(){
  const box = $("#slides"), head = $("#sHead"), text = $("#sText"), card = $("#sCard"), next = $("#sNext"), back = $("#sBack"), num = $("#sNum"), bar = $("#sBarI");
  box.classList.add("show");
  let idx = 0, typing = false, skipType = false, token = 0, lastHead = "";
  // har slayd uchun sarlavhani topamiz
  const heads = []; SLIDES.forEach((s,i)=>{ if (s.h) lastHead = s.h; heads[i] = lastHead; });

  async function typeInto(el, str, speed, my){
    for (const ch of str){
      if (my !== token) return;
      el.textContent += ch;
      if (ch !== " " && ch !== "\n") Snd.key(.05);
      if (skipType) continue;
      let d = speed + Math.random()*speed*.5;
      if (ch === "\n") d += 260; else if (".!?".includes(ch)) d += 280; else if (",—".includes(ch)) d += 140;
      await sleep(d);
    }
  }
  async function show(i){
    const my = ++token, s = SLIDES[i];
    typing = true; skipType = false;
    next.classList.remove("on"); back.style.visibility = i > 0 ? "visible" : "hidden";
    head.textContent = heads[i];
    num.textContent = `${String(i+1).padStart(2,"0")} / ${SLIDES.length}`;
    bar.style.width = ((i+1)/SLIDES.length*100) + "%";
    text.className = (s.big ? "big" : "") + (s.gold ? " gold" : "");
    text.textContent = "";
    const caret = document.createElement("span"); caret.className = "caret";
    card.style.display = "none"; card.innerHTML = "";
    await sleep(350); if (my !== token) return;

    if (s.author){
      // muallif kartasi: "ukang" o'chib, akaning ismi yoziladi
      card.style.display = "block";
      card.innerHTML = `<div class="f">akamga.html</div><span class="k">muallif</span>: <span class="v" id="auth"></span><span class="caret" style="display:inline-block;width:.5em;height:1.05em;background:var(--green);vertical-align:-0.12em;animation:blink 1s steps(1) infinite"></span>`;
      const a = card.querySelector("#auth");
      await typeInto(a, "ukang", 90, my); if (my !== token) return;
      await sleep(skipType ? 0 : 1400);
      for (let k=0;k<5;k++){ if (my !== token) return; a.textContent = a.textContent.slice(0,-1); Snd.key(.05); await sleep(skipType ? 0 : 110); }
      await sleep(skipType ? 0 : 500);
      a.className = "gold";
      await typeInto(a, `${CONFIG.aka} akam`, 85, my); if (my !== token) return;
      Snd.low();
      await sleep(skipType ? 0 : 900);
      card.querySelector(".caret")?.remove();
    }
    text.appendChild(caret);
    const tn = document.createTextNode(""); text.insertBefore(tn, caret);
    await typeInto(tn, s.t, s.slow ? 95 : (s.big ? 60 : 42), my); if (my !== token) return;
    if (s.big) Snd.bell(s.gold ? 587.3 : 440, .07);
    typing = false;
    await sleep(500); if (my !== token) return;
    next.textContent = i === SLIDES.length-1 ? "yakunlash →" : "davom →";
    next.classList.add("on");
  }
  return new Promise(resolve => {
    const go = () => {
      if (typing){ skipType = true; return; }          // birinchi bosish — matnni to'liq chiqaradi
      if (idx < SLIDES.length-1){ idx++; show(idx); }
      else { box.classList.remove("show"); resolve(); }
    };
    next.onclick = e => { e.stopPropagation(); go(); };
    back.onclick = e => { e.stopPropagation(); if (idx > 0){ idx--; skipType = true; show(idx).then(()=>{}); } };
    box.onclick = () => { if (typing) skipType = true; else if (next.classList.contains("on")) go(); };
    show(0);
  });
}

/* ============ 6) YAKUN ============ */
let bgRainOn = false;
function bgRain(){
  if (bgRainOn) return; bgRainOn = true;
  const cv = $("#bgRain"), x = cv.getContext("2d"), cs = 14; let W, H, n, ys;
  const fit = () => { W = innerWidth; H = innerHeight; cv.width = W*DPR; cv.height = H*DPR; x.setTransform(DPR,0,0,DPR,0,0);
    n = Math.ceil(W/cs); ys = Array.from({length:n}, () => Math.random()*-H/cs); x.font = `${cs}px "JetBrains Mono", monospace`; };
  fit(); addEventListener("resize", fit);
  let last = 0;
  (function f(t){
    if (t - last > 60){ last = t; x.fillStyle = "rgba(0,0,0,.12)"; x.fillRect(0,0,W,H); x.fillStyle = "#3dff7a";
      for (let i=0;i<n;i++){ x.fillText(rc(), i*cs, ys[i]*cs); ys[i]++; if (ys[i]*cs > H && Math.random() > .975) ys[i] = 0; } }
    requestAnimationFrame(f);
  })(0);
}

}
